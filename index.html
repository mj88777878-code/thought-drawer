<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought Drawer</title>
<style>
/* ── 테마: 열대 바다 위에 뜬 Fluent 유리창 ── */
:root{
  color-scheme:dark;
  --glass:rgba(20,28,36,.70); --bar:rgba(8,14,20,.55);
  --card:rgba(255,255,255,.07); --card-hi:rgba(255,255,255,.12);
  --ink:#f3f7fa; --muted:#aebfcc; --line:rgba(255,255,255,.15);
  --accent:#4cc9f0; --on-accent:#05222e; --focus:#8fe6ff; --star:#ffd166; --shadow:rgba(0,10,30,.45);
  --c-x1:#6cc4ff; --c-x2:#ff8fc1; --c-x3:#ffa95c; --c-x4:#b6e35a; --c-x5:#e0c3a0; --c-x6:#a0b4c8;
  --c-dream:#9aa9ff; --c-log:#4fd8c8; --c-idea:#ffd166; --c-todo:#ff9582; --c-read:#c2a8ff; --c-thanks:#8be08f;
}
:root[data-theme="light"]{
  color-scheme:light;
  --glass:rgba(244,250,253,.72); --bar:rgba(255,255,255,.55);
  --card:rgba(255,255,255,.62); --card-hi:rgba(255,255,255,.9);
  --ink:#10202c; --muted:#4a6070; --line:rgba(16,32,44,.15);
  --accent:#0a79c4; --on-accent:#fff; --focus:#005a9e; --star:#b7791f; --shadow:rgba(0,40,90,.3);
  --c-x1:#1f7fc4; --c-x2:#cc4a8a; --c-x3:#d26a13; --c-x4:#6d9a14; --c-x5:#a07b45; --c-x6:#5a7088;
  --c-dream:#5b6bd6; --c-log:#0e9d8e; --c-idea:#c58a0a; --c-todo:#d4553f; --c-read:#8452d6; --c-thanks:#3f9a47;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:#0b57b3;color:var(--ink);
  font-family:"Segoe UI Variable","Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6;font-size:15px}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* 배경: 열대 바다(SVG) */
.wallpaper{position:fixed;inset:0;width:100%;height:100%;z-index:-1}

/* 유리창 */
.window{display:flex;flex-direction:column;height:calc(100dvh - 40px);max-width:1280px;margin:20px auto;
  background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px var(--shadow),0 2px 8px var(--shadow);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:10px;height:40px;padding-left:14px;background:var(--bar);border-bottom:1px solid var(--line);font-size:12px;flex:none}
.titlebar .ico{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#4cc9f0,#1a6fd0);display:inline-block}
.wc{margin-left:auto;display:flex;height:100%;pointer-events:none;user-select:none}
.wc i{width:46px;display:grid;place-items:center;font-style:normal;color:var(--muted);font-size:12px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}

/* 서랍장 */
.cabinet{padding:22px 12px;border-right:1px solid var(--line);overflow:auto}
.brand{padding:0 10px 18px}
.brand h1{font-size:22px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.drawer{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;margin-bottom:3px;
  background:transparent;border:0;border-radius:6px;text-align:left;position:relative}
.drawer:hover{background:var(--card)}
.drawer[aria-current="true"]{background:var(--card-hi)}
.drawer[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--c)}
.drawer .name{display:flex;gap:10px;align-items:center;font-weight:500}
.drawer .name span[aria-hidden]{color:var(--c);width:18px;text-align:center}
.drawer .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cab-foot{margin-top:20px;padding:0 6px;display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);background:var(--card-hi)}

/* 본문 */
main{display:flex;flex-direction:column;overflow:auto;padding:24px clamp(16px,3vw,36px) 16px}
main>*{flex-shrink:0}
.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h2{font-size:28px}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.search{flex:1;min-width:180px;max-width:320px;padding:8px 14px;border:1px solid var(--line);border-bottom-color:var(--accent);border-radius:6px;background:var(--card)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:8px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.stat{flex:1;min-width:110px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c)}
.stat b{font-size:26px;display:block;line-height:1.15;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}

.section-title{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:26px}
.note{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.note:hover{background:var(--card-hi)}
.note h3{font-size:17px;line-height:1.35}
.note p{margin:0;opacity:.88;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12px;color:var(--muted);gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 9px}
.acts{display:flex;gap:2px}
.acts button{background:none;border:0;padding:4px 6px;color:var(--muted);border-radius:4px;font-size:13px}
.acts button:hover{color:var(--ink);background:var(--card-hi)}
.pin-on{color:var(--star)!important}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* 하단 플로팅 툴바 (이미지 하단의 알약형 바) */
.quick{position:sticky;bottom:0;margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--bar);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 8px;box-shadow:0 8px 24px var(--shadow)}
.quick select{border:0;background:var(--card);border-radius:999px;padding:7px 12px}
.quick input{flex:1;min-width:180px;border:0;background:transparent;padding:8px;outline-offset:0}
.quick .btn{border-radius:999px;padding:8px 18px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  color:var(--ink);padding:22px;width:min(520px,92vw);box-shadow:0 24px 60px var(--shadow)}
dialog::backdrop{background:rgba(0,20,50,.45)}
dialog h3{font-size:20px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-bottom-color:var(--accent);border-radius:6px;background:var(--card);padding:9px 10px;color:var(--ink);font-size:15px}
.f textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.on{opacity:1}

.drawer.add{color:var(--muted);margin-top:6px}
.drawer.add:hover{color:var(--ink)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:17px;color:var(--ink)}
.opt input:checked+span{border-color:var(--accent);background:var(--card-hi);box-shadow:0 0 0 1px var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:760px){
  .window{height:auto;margin:0;border-radius:0;border-width:0;min-height:100dvh}
  .app{grid-template-columns:1fr}
  .cabinet{border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .drawers{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .drawer{width:auto;flex:0 0 auto;margin:0;gap:12px}
  .cab-foot{margin-top:10px}
  main{overflow:visible}
  .quick{border-radius:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- 배경: 열대 바다, 산호초, 작은 섬 -->
<svg class="wallpaper" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1673d6"/><stop offset=".6" stop-color="#58aeea"/><stop offset="1" stop-color="#b7e0f7"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a86cc"/><stop offset=".35" stop-color="#0b57b3"/><stop offset="1" stop-color="#052f7c"/></linearGradient>
    <filter id="b4" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b10" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b24" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="520" fill="url(#sky)"/>
  <rect y="500" width="1600" height="400" fill="url(#sea)"/>
  <g fill="#fff" filter="url(#b10)" opacity=".92">
    <ellipse cx="260" cy="120" rx="150" ry="36"/><ellipse cx="380" cy="152" rx="110" ry="28"/><ellipse cx="180" cy="175" rx="90" ry="22"/>
    <ellipse cx="1150" cy="90" rx="170" ry="34"/><ellipse cx="1310" cy="132" rx="120" ry="28"/>
    <ellipse cx="760" cy="205" rx="140" ry="30"/><ellipse cx="900" cy="230" rx="100" ry="22"/>
    <ellipse cx="1480" cy="265" rx="110" ry="26"/><ellipse cx="520" cy="320" rx="120" ry="24"/>
  </g>
  <ellipse cx="800" cy="512" rx="900" ry="16" fill="#d3ecf9" opacity=".7" filter="url(#b10)"/>
  <path d="M1180 508 Q1260 468 1340 482 Q1420 460 1500 480 L1600 490 L1600 512 L1180 512Z" fill="#3d7f9a" opacity=".85" filter="url(#b4)"/>
  <ellipse cx="330" cy="510" rx="120" ry="6" fill="#5aa3a0" opacity=".7" filter="url(#b4)"/>
  <g filter="url(#b24)">
    <ellipse cx="800" cy="700" rx="380" ry="120" fill="#1fb8d4" opacity=".85"/>
    <ellipse cx="1250" cy="590" rx="230" ry="50" fill="#2bb6d6" opacity=".6"/>
    <ellipse cx="260" cy="840" rx="380" ry="110" fill="#22c3d8" opacity=".8"/>
    <ellipse cx="560" cy="600" rx="200" ry="36" fill="#2aa8d0" opacity=".5"/>
  </g>
  <g filter="url(#b10)">
    <ellipse cx="800" cy="690" rx="270" ry="86" fill="#52e0e0" opacity=".9"/>
    <ellipse cx="800" cy="685" rx="190" ry="60" fill="#9af3ea" opacity=".9"/>
  </g>
  <ellipse cx="800" cy="682" rx="120" ry="34" fill="#f4efe0" filter="url(#b4)"/>
  <ellipse cx="800" cy="672" rx="70" ry="20" fill="#2f7a36"/>
  <ellipse cx="790" cy="665" rx="50" ry="9" fill="#52a049" filter="url(#b4)"/>
</svg>

<div class="window">
  <div class="titlebar">
    <span class="ico" aria-hidden="true"></span><span>Thought Drawer</span>
    <span class="wc" aria-hidden="true"><i>&#x2500;</i><i>&#x25A1;</i><i>&#x2715;</i></span>
  </div>
  <div class="app">
    <aside class="cabinet">
      <div class="brand">
        <h1>Thought Drawer</h1>
        <p>흩어진 생각을 칸마다 넣어두는 곳</p>
      </div>
      <nav class="drawers" id="drawers" aria-label="서랍 목록"></nav>
      <div class="cab-foot">
        <button class="ghost" id="exportBtn">내보내기</button>
        <button class="ghost" id="importBtn">불러오기</button>
        <button class="ghost" id="themeBtn">테마</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </aside>

    <main>
      <div class="top">
        <div>
          <h2 id="title">전체</h2>
          <div class="sub" id="sub"></div>
        </div>
        <input class="search" id="search" type="search" placeholder="제목, 내용, 태그 검색" aria-label="검색">
        <button class="ghost" id="delDrawerBtn" hidden>서랍 삭제</button>
        <button class="btn" id="newBtn">새 메모</button>
      </div>

      <div class="stats" id="stats"></div>
      <div id="pinnedWrap"></div>
      <div id="listWrap"></div>

      <div class="quick">
        <select id="qDrawer" aria-label="넣을 서랍"></select>
        <input id="qText" placeholder="떠오른 한 줄을 적고 Enter" aria-label="빠른 기록">
        <button class="btn" id="qAdd">서랍에 넣기</button>
      </div>
    </main>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">새 메모</h3>
    <label class="f">서랍<select id="fDrawer"></select></label>
    <label class="f">제목<input id="fTitle" maxlength="80" required></label>
    <label class="f">내용<textarea id="fBody"></textarea></label>
    <label class="f">태그 (쉼표로 구분)<input id="fTags" placeholder="예: 바다, 가족"></label>
    <div class="row">
      <button type="button" class="ghost" id="cancel">닫기</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</dialog>
<dialog id="ddlg">
  <form method="dialog" id="dform">
    <h3>새 서랍 만들기</h3>
    <label class="f">이름<input id="dName" maxlength="12" required placeholder="예: 여행, 운동, 레시피"></label>
    <div class="f">아이콘<div class="pick" id="dIcons"></div></div>
    <div class="f">색<div class="pick" id="dColors"></div></div>
    <div class="row">
      <button type="button" class="ghost" id="dCancel">닫기</button>
      <button type="submit" class="btn">만들기</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const BASE_DRAWERS=[
  {id:"dream",name:"꿈",icon:"☾",color:"--c-dream",hint:"깨자마자 적은 장면과 느낌"},
  {id:"log",name:"기록",icon:"✎",color:"--c-log",hint:"오늘 있었던 일과 생각"},
  {id:"idea",name:"아이디어",icon:"✦",color:"--c-idea",hint:"언젠가 쓸 씨앗들"},
  {id:"todo",name:"할 일",icon:"☐",color:"--c-todo",hint:"잊지 말아야 할 것"},
  {id:"read",name:"읽을거리",icon:"❏",color:"--c-read",hint:"책, 영상, 링크, 문장"},
  {id:"thanks",name:"감사",icon:"♡",color:"--c-thanks",hint:"고마웠던 순간"}
];
const KEY="thought-drawer-v1";
const $=s=>document.querySelector(s);
const DKEY="thought-drawer-custom-v1";
const ICONS=["★","♪","⌂","✈","☕","✿","☀","⚑","♟","✉","☘","⚙"];
const COLORS=["--c-x1","--c-x2","--c-x3","--c-x4","--c-x5","--c-x6"];
let custom=[];try{custom=JSON.parse(localStorage.getItem(DKEY))||[]}catch(e){}
let DRAWERS=[],dmap={};
function buildDrawers(){DRAWERS=[...BASE_DRAWERS,...custom];dmap=Object.fromEntries(DRAWERS.map(d=>[d.id,d]))}
function saveDrawers(){try{localStorage.setItem(DKEY,JSON.stringify(custom))}catch(e){toast("서랍을 저장하지 못했어요. 내보내기로 백업해 주세요.")}}
buildDrawers();
let notes=[], view="all", query="", editId=null;

/* 저장 */
function load(){
  try{const r=localStorage.getItem(KEY);if(r){notes=JSON.parse(r);notes.forEach(n=>{if(!dmap[n.d])n.d="log"});return}}catch(e){}
  const t=Date.now(), day=864e5;
  notes=[
    {id:"s1",d:"dream",title:"끝없이 이어진 도서관",body:"책장이 하늘까지 이어져 있었고, 사다리를 타고 올라갈수록 책 제목이 내가 쓴 문장으로 바뀌었다.",tags:["도서관","반복되는 꿈"],pin:true,t:t-day},
    {id:"s2",d:"log",title:"아침 산책",body:"바람이 선선해서 평소보다 오래 걸었다. 머릿속이 조금 정리된 느낌.",tags:["일상"],pin:false,t:t-2*day},
    {id:"s3",d:"idea",title:"서랍 모양 메모 앱",body:"메모를 칸에 넣고 꺼내 보는 방식. 오래 열지 않은 서랍은 먼지가 쌓이는 표시?",tags:["앱","UI"],pin:true,t:t-3*day},
    {id:"s4",d:"todo",title:"이번 주 정리할 것",body:"책상 서랍 비우기\n밀린 메일 답장\n여행 일정 확인",tags:["이번주"],pin:false,t:t-day/2},
    {id:"s5",d:"read",title:"다시 읽고 싶은 문장",body:"출처와 함께 적어두기. 마음에 남은 문장은 바로 여기에.",tags:["문장"],pin:false,t:t-4*day},
    {id:"s6",d:"thanks",title:"따뜻한 국물",body:"퇴근길에 먹은 따뜻한 국물 한 그릇이 오늘 하루를 살렸다.",tags:["하루"],pin:false,t:t-5*day}
  ];
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){toast("저장하지 못했어요. 내보내기로 백업해 주세요.")}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleDateString("ko-KR",{month:"long",day:"numeric"});

/* 화면 */
function renderNav(){
  const all=`<button class="drawer" style="--c:var(--accent)" data-v="all" aria-current="${view==="all"}"><span class="name">▤ 전체</span><span class="count">${notes.length}</span></button>`;
  $("#drawers").innerHTML=all+DRAWERS.map(d=>{
    const n=notes.filter(x=>x.d===d.id).length;
    return `<button class="drawer" style="--c:var(${d.color})" data-v="${d.id}" aria-current="${view===d.id}"><span class="name"><span aria-hidden="true">${esc(d.icon)}</span>${esc(d.name)}</span><span class="count">${n}</span></button>`}).join("")+`<button class="drawer add" style="--c:var(--accent)" data-add="1"><span class="name"><span aria-hidden="true">＋</span>서랍 추가</span></button>`;
  const opts=DRAWERS.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("");
  const fcur=$("#fDrawer").value;$("#fDrawer").innerHTML=opts;if(fcur&&dmap[fcur])$("#fDrawer").value=fcur;
  const cur=$("#qDrawer").value;
  $("#qDrawer").innerHTML=opts;
  $("#qDrawer").value=view!=="all"?view:(cur||"idea");
}
function card(n){
  const d=dmap[n.d];
  return `<article class="note" style="--c:var(${d.color})">
    <h3>${esc(n.title)}</h3>
    <p>${esc(n.body)}</p>
    <div class="meta">
      <div class="tags"><span class="tag">${esc(d.name)}</span>${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
      <span>${fmt(n.t)}</span>
    </div>
    <div class="acts">
      <button data-a="pin" data-id="${n.id}" class="${n.pin?"pin-on":""}" aria-label="${n.pin?"고정 해제":"고정"}">${n.pin?"★ 고정됨":"☆ 고정"}</button>
      <button data-a="edit" data-id="${n.id}">수정</button>
      <button data-a="del" data-id="${n.id}">삭제</button>
    </div></article>`;
}
function render(){
  renderNav();
  const d=dmap[view];
  $("#title").textContent=d?d.name:"전체";
  $("#sub").textContent=d?d.hint:"모든 서랍에 든 메모";
  $("#delDrawerBtn").hidden=!(d&&d.custom);
  $("#stats").innerHTML=view==="all"?DRAWERS.map(x=>`<div class="stat" style="--c:var(${x.color})"><b>${notes.filter(n=>n.d===x.id).length}</b><span>${esc(x.name)}</span></div>`).join(""):"";
  const q=query.trim().toLowerCase();
  let list=notes.filter(n=>(view==="all"||n.d===view)&&(!q||(n.title+n.body+n.tags.join(" ")).toLowerCase().includes(q)));
  list.sort((a,b)=>b.t-a.t);
  const pins=list.filter(n=>n.pin), rest=list.filter(n=>!n.pin);
  $("#pinnedWrap").innerHTML=pins.length?`<h3 class="section-title">고정한 메모</h3><div class="grid">${pins.map(card).join("")}</div>`:"";
  $("#listWrap").innerHTML=list.length
    ?(rest.length?`<h3 class="section-title">${pins.length?"나머지 메모":"최근 메모"}</h3><div class="grid">${rest.map(card).join("")}</div>`:"")
    :`<div class="empty">${q?"검색 결과가 없어요. 다른 단어로 찾아보세요.":"이 서랍은 비어 있어요. 위의 입력창에 첫 메모를 넣어보세요."}</div>`;
}

/* 편집 */
function openDlg(id){
  editId=id||null;
  const n=notes.find(x=>x.id===id);
  $("#dlgTitle").textContent=n?"메모 수정":"새 메모";
  $("#fDrawer").value=n?n.d:(view!=="all"?view:"idea");
  $("#fTitle").value=n?n.title:"";
  $("#fBody").value=n?n.body:"";
  $("#fTags").value=n?n.tags.join(", "):"";
  $("#dlg").showModal();
  $("#fTitle").focus();
}
$("#form").addEventListener("submit",e=>{
  const tags=$("#fTags").value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean);
  const data={d:$("#fDrawer").value,title:$("#fTitle").value.trim(),body:$("#fBody").value,tags};
  if(editId){Object.assign(notes.find(n=>n.id===editId),data);toast("수정했어요")}
  else{notes.push({id:"n"+Date.now(),pin:false,t:Date.now(),...data});toast("서랍에 넣었어요")}
  save();render();
});
$("#cancel").onclick=()=>$("#dlg").close();
$("#newBtn").onclick=()=>openDlg();

function quickAdd(){
  const v=$("#qText").value.trim(); if(!v)return;
  notes.push({id:"n"+Date.now(),d:$("#qDrawer").value,title:v.length>30?v.slice(0,30)+"…":v,body:v.length>30?v:"",tags:[],pin:false,t:Date.now()});
  $("#qText").value="";save();render();toast("서랍에 넣었어요");
}
$("#qAdd").onclick=quickAdd;
$("#qText").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)quickAdd()});

/* 이벤트 */
function openDDlg(){
  $("#dName").value="";
  $("#dIcons").innerHTML=ICONS.map((i,k)=>`<label class="opt"><input type="radio" name="dIcon" value="${i}" ${k===0?"checked":""} aria-label="아이콘 ${i}"><span>${i}</span></label>`).join("");
  $("#dColors").innerHTML=COLORS.map((c,k)=>`<label class="opt"><input type="radio" name="dColor" value="${c}" ${k===0?"checked":""} aria-label="색 ${k+1}"><span style="background:var(${c})"></span></label>`).join("");
  $("#ddlg").showModal();$("#dName").focus();
}
$("#dform").addEventListener("submit",()=>{
  const name=$("#dName").value.trim();if(!name)return;
  const id="c"+Date.now();
  custom.push({id,name,icon:$("input[name=dIcon]:checked").value,color:$("input[name=dColor]:checked").value,hint:"직접 만든 서랍",custom:true});
  saveDrawers();buildDrawers();view=id;render();toast("새 서랍을 만들었어요");
});
$("#dCancel").onclick=()=>$("#ddlg").close();
$("#delDrawerBtn").onclick=()=>{
  const d=dmap[view];if(!d||!d.custom)return;
  const n=notes.filter(x=>x.d===d.id).length;
  if(!confirm("'"+d.name+"' 서랍을 삭제할까요?"+(n?" 안의 메모 "+n+"개는 '기록' 서랍으로 옮겨져요.":"")))return;
  notes.forEach(x=>{if(x.d===d.id)x.d="log"});
  custom=custom.filter(c=>c.id!==d.id);saveDrawers();save();buildDrawers();view="all";render();toast("서랍을 삭제했어요");
};
$("#drawers").addEventListener("click",e=>{if(e.target.closest("[data-add]")){openDDlg();return}const b=e.target.closest("[data-v]");if(b){view=b.dataset.v;render()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const n=notes.find(x=>x.id===b.dataset.id);if(!n)return;
  if(b.dataset.a==="pin"){n.pin=!n.pin;save();render()}
  if(b.dataset.a==="edit")openDlg(n.id);
  if(b.dataset.a==="del"&&confirm("이 메모를 삭제할까요?")){notes=notes.filter(x=>x!==n);save();render();toast("삭제했어요")}
});
$("#search").addEventListener("input",e=>{query=e.target.value;render()});

/* 내보내기 / 불러오기 / 테마 */
$("#exportBtn").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,drawers:custom,notes},null,2)],{type:"application/json"}));
  a.download="thought-drawer-"+new Date().toISOString().slice(0,10)+".json";a.click();
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    try{const data=JSON.parse(t);const arr=Array.isArray(data)?data:data.notes;if(!Array.isArray(arr))throw 0;
      if(!Array.isArray(data)&&Array.isArray(data.drawers)){
        data.drawers.filter(d=>d&&d.id&&d.name).forEach(d=>{const id=String(d.id).replace(/[^\w-]/g,"");
          if(id&&!dmap[id])custom.push({id,name:String(d.name).slice(0,12),icon:String(d.icon||"★").slice(0,2),color:COLORS.includes(d.color)?d.color:COLORS[0],hint:"직접 만든 서랍",custom:true});
          buildDrawers()});
        saveDrawers();
      }
      const ids=new Set(notes.map(n=>n.id));
      arr.filter(n=>n&&n.id&&dmap[n.d]&&!ids.has(n.id)).forEach(n=>notes.push({pin:false,tags:[],body:"",t:Date.now(),...n}));
      save();render();toast("불러왔어요");
    }catch(_){toast("올바른 백업 파일이 아니에요")}
  });e.target.value="";
});
$("#themeBtn").onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==="light"?"dark":"light";
};

load();render();
</script>
</body>
</html>
